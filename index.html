<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naitik Trading</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
  scroll-behavior: smooth;
}

body {
  background: #050505;
  color: white;
  line-height: 1.6;
}

nav {
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(10px);
  padding: 20px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #1f1f1f;
}

nav h1 {
  font-size: 28px;
}

nav ul {
  display: flex;
  list-style: none;
  gap: 25px;
}

nav ul li a {
  color: white;
  text-decoration: none;
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 8%;
}

.hero h2 {
  font-size: 60px;
}

.btn {
  display: inline-block;
  padding: 12px 25px;
  margin: 10px;
  border-radius: 10px;
  background: white;
  color: black;
  text-decoration: none;
  font-weight: bold;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap: 20px;
}

.card {
  background: #111;
  padding: 20px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 15px;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #111;
  padding: 25px;
  border-radius: 15px;
  width: 90%;
  max-width: 600px;
}

.close {
  float: right;
  cursor: pointer;
  font-size: 25px;
}
</style>
</head>

<body>

<nav>
<h1>NAITIK TRADING</h1>
<ul>
<li><a href="#products">Products</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>

<!-- HERO -->
<section class="hero">
  <div>
    <h2>Premium Raw Material Supplier</h2>
    <p>Bricks, Charcoal & Construction Materials</p>

    <a href="https://wa.me/919479062816" class="btn">WhatsApp</a>

    <a href="mailto:noddykumat46@gmail.com" class="btn">Email</a>

    <a href="tel:+919479062816" class="btn">Call</a>
  </div>
</section>

<!-- PRODUCTS -->
<section id="products">
  <h2 style="text-align:center; margin-bottom:30px;">Products</h2>

  <div class="cards">

    <div class="card" onclick="openModal('bed')">
      <img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd">
      <h3>Bed Materials</h3>
    </div>

    <div class="card" onclick="openModal('fire')">
      <img src="https://images.unsplash.com/photo-1603791440384-56cd371ee9a7">
      <h3>Fire Bricks</h3>
    </div>

    <div class="card" onclick="openModal('charcoal')">
      <img src="https://images.unsplash.com/photo-1615485290382-441e4d049cb5">
      <h3>Charcoal</h3>
    </div>

  </div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>

    <div id="modal-body"></div>
  </div>
</div>

<script>
function openModal(type) {
  let content = "";

  if(type === "bed") {
    content = `
      <h2>Bed Materials</h2>
      <p><b>Sizes:</b> Fine, Medium, Coarse</p>
      <p>Used in construction, RCC, plaster work.</p>
      <img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd" style="width:100%;border-radius:10px;">
    `;
  }

  if(type === "fire") {
    content = `
      <h2>Fire Bricks</h2>
      <p><b>Size:</b> 9x4.5x3 inch</p>
      <p>Heat resistant up to 1800°C</p>
      <img src="https://images.unsplash.com/photo-1603791440384-56cd371ee9a7" style="width:100%;border-radius:10px;">
    `;
  }

  if(type === "charcoal") {
    content = `
      <h2>Charcoal</h2>
      <p><b>Types:</b> Lump, Powder</p>
      <p>Used in industrial heating & forging</p>
      <img src="https://images.unsplash.com/photo-1615485290382-441e4d049cb5" style="width:100%;border-radius:10px;">
    `;
  }

  document.getElementById("modal-body").innerHTML = content;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
